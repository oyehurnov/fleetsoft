version: '3.8'

services:
  app:
    image: yiisoftware/yii2-php:8.2-apache
    container_name: yii2_app
    volumes:
      - .:/app
    ports:
      - "8080:80"
    environment:
      - APACHE_DOCUMENT_ROOT=/app/yii2-app/web
      - TZ=Europe/Kyiv
    command: >
      bash -c "sed -i 's|DocumentRoot /app/web|DocumentRoot /app/yii2-app/web|g' /etc/apache2/sites-enabled/000-default.conf &&
               sed -i 's|<Directory /app/web/>|<Directory /app/yii2-app/web/>|g' /etc/apache2/sites-enabled/000-default.conf &&
               apache2-foreground"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: yii2_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yii2db
      MYSQL_USER: yii2user
      MYSQL_PASSWORD: yii2pass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

volumes:
  db_data:
